services:
  sc-loot-raffle:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - sc_loot_data:/data
    restart: unless-stopped
    # N3: Härtung — optional. Kommentar-Blöcke nach Bedarf aktivieren:
    # read_only: true          # Root-Dateisystem read-only (Daten kommen aus dem Volume)
    # tmpfs:
    #   - /tmp                 # beschreibbares /tmp trotz read_only:true
    # security_opt:
    #   - no-new-privileges:true
    # cap_drop:
    #   - ALL
    # Resource-Limits (Beispiel — an den Host anpassen):
    # mem_limit: 256m
    # cpus: 0.50

volumes:
  sc_loot_data:
